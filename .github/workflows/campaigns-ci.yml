name: CI Campanhas Comerciais
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/campaignEngine.test.ts
      - run: npx tsx src/tests/campaignSkuSearch.test.ts
      - run: npx tsx src/tests/campaignExtraction.test.ts
      - run: npm run build
